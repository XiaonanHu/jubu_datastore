      adjacent: [knowledge_domain.the_moon, knowledge_domain.day_and_night, knowledge_domain.weather]
      prerequisite: []
    crosswalk:
      ngss: ["1-ESS1-1", "5-ESS1-1"]
      casel: []
    milestones:
      note: ""
      reviewed_by: null
    status: draft

