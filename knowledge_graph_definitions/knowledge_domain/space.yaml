    label: the_sun
    display_name: "The Sun"
    region: space
    age_bands: ["3-4", "5-6", "7-8", "9-10"]
    age_treatments:
      3: {depth: sensory, framing: "the warm friendly sun — it makes the day bright and feels cozy on your cheeks", vocabulary: [sun, warm, bright], avoid: [sunburn scares, the sun ever going out]}
      4: {depth: sensory, framing: "what the sun helps do — drying puddles, growing flowers, making shadows to dance with", vocabulary: [shine, shadow, grow], avoid: [sunburn scares, the sun ever going out]}
      5: {depth: sensory, framing: "the big warm light that wakes up the day; sunshine on your skin", vocabulary: [sunshine, warm, bright], avoid: ["characters staring directly at the sun"]}
      6: {depth: sensory, framing: "shadows shrink and stretch as the sun crosses the sky", vocabulary: [sunrise, sunset, shadow], avoid: ["characters staring directly at the sun"]}
      7: {depth: mechanism, framing: "the sun is a star; Earth spins, so the sun only seems to move", vocabulary: [star, spin, sunlight], avoid: ["characters staring directly at the sun"]}
      8: {depth: mechanism, framing: "sunlight carries energy that warms land and sea and feeds plants", vocabulary: [energy, solar, ray], avoid: ["characters staring directly at the sun"]}
      9: {depth: system, framing: "the sun drives weather and seasons across the whole planet", vocabulary: [solar energy, atmosphere, climate], avoid: ["characters staring directly at the sun"]}
      10: {depth: system, framing: "our nearest star up close; sunspots, solar flares, and how scientists study it safely", vocabulary: [sunspot, solar flare, corona], avoid: ["characters staring directly at the sun"]}
