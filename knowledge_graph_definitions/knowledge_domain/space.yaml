axis: knowledge_domain
pack: space
nodes:
  - id: knowledge_domain.the_moon
    axis: knowledge_domain
    label: the_moon
    display_name: "The Moon"
    region: space
    age_bands: ["3-4", "5-6", "7-8", "9-10"]
    age_treatments:
      3: {depth: sensory, framing: "the moon says good night — a soft white light in the sky watching over sleepy houses", vocabulary: [moon, night, glow], avoid: [darkness as scary, the moon disappearing forever]}
      4: {depth: sensory, framing: "the moon changes shape — sometimes a big round circle, sometimes a little banana sliver", vocabulary: [round, sliver, sky], avoid: [darkness as scary, the moon disappearing forever]}
      5: {depth: sensory, framing: "the friendly light in the night sky; why it seems to follow you", vocabulary: [moonlight, glow, crater]}
      6: {depth: sensory, framing: "the moon changes shape night by night; footprints that never blow away", vocabulary: [crescent, full moon, crater]}
      7: {depth: mechanism, framing: "why the moon has phases; orbiting the Earth", vocabulary: [orbit, phase, reflect]}
      8: {depth: mechanism, framing: "gravity holds the moon in orbit; tides tug on the sea", vocabulary: [gravity, tide, lunar]}
      9: {depth: system, framing: "the moon landings; how the moon shapes life on Earth", vocabulary: [Apollo, lunar module, eclipse]}
      10: {depth: system, framing: "returning to the moon; moon bases and what living there would take", vocabulary: [regolith, lunar orbit, mission]}
    edges:
      adjacent: [knowledge_domain.the_sun, knowledge_domain.astronauts_and_space_travel, knowledge_domain.oceans_and_tides]
      prerequisite: []
    crosswalk:
      ngss: ["1-ESS1-1"]
      casel: []
    milestones:
      note: ""
      reviewed_by: null
    status: draft

  - id: knowledge_domain.the_sun
