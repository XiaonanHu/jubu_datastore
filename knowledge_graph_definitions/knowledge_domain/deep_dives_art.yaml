    label: painting_pictures
    display_name: "Painting Pictures"
    region: arts_and_music
    tier: deep_dive
    subtopic_of: knowledge_domain.drawing_and_animation
    facets: [mixing_colors, brushes_and_strokes, painting_what_you_feel, happy_accidents]
    age_bands: ["7-8", "9-10", "11-12"]
    age_treatments:
      7: {depth: mechanism, framing: "how two colors on a palette become a brand-new third one, and why a fat brush and a skinny brush leave such different marks", vocabulary: [palette, brushstroke, blend], avoid: ["talent you either have or don't", comparing children's art]}
      9: {depth: system, framing: "painters plan a picture but stay ready for surprises; a drip or a smudge can become the best part if you let it", vocabulary: [composition, texture, happy accident], avoid: ["talent you either have or don't", comparing children's art]}
      11: {depth: system, framing: "painters argue with their own picture; stepping back, scraping off, layering over — a finished painting is many paintings stacked up", vocabulary: [layer, underpainting, revise], avoid: ["talent you either have or don't", comparing children's art]}
