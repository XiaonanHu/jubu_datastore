    facets: [panels_in_order, speech_bubbles, drawing_the_same_character_twice, flipbooks]
    age_bands: ["7-8", "9-10", "11-12"]
    age_treatments:
      7: {depth: mechanism, framing: "a comic tells a story in little boxes read in order, with speech bubbles doing the talking; flip the pages fast and drawings start to move", vocabulary: [panel, speech bubble, flipbook]}
