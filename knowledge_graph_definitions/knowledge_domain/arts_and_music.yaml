  - id: knowledge_domain.clothes_and_fashion
    axis: knowledge_domain
    label: clothes_and_fashion
    display_name: "Clothes and Fashion"
    region: arts_and_music
    age_bands: ["5-6", "7-8", "9-10", "11-12"]
    age_treatments:
      5: {depth: sensory, framing: "soft, scratchy, stripy, sparkly; dressing up and choosing what feels like you today", vocabulary: [dress up, pattern, sparkly], avoid: [appearance as worth, comparing bodies or looks]}
      6: {depth: sensory, framing: "clothes with jobs to do; raincoats, aprons, helmets, and costumes for pretending", vocabulary: [costume, uniform, fabric], avoid: [appearance as worth, comparing bodies or looks]}
      7: {depth: mechanism, framing: "how clothes get made; thread spun into cloth, cloth cut from a paper pattern, and sewn into something you can wear", vocabulary: [thread, weave, sew], avoid: [appearance as worth, comparing bodies or looks]}
      8: {depth: mechanism, framing: "face paint and stage makeup as costume for your face; turning an actor into a lion, a robot, or a hundred-year-old sailor", vocabulary: [stage makeup, face paint, transform], avoid: [appearance as worth, comparing bodies or looks, makeup as fixing your face]}
      9: {depth: system, framing: "why people dress differently across the world and across time; kimonos, kilts, saris, and what an outfit can celebrate", vocabulary: [tradition, sari, style], avoid: [appearance as worth, comparing bodies or looks, ranking cultures]}
      10: {depth: system, framing: "inside a designer's sketchbook; drawing an idea, choosing fabrics, and fitting a garment on a real moving person", vocabulary: [designer, sketch, garment], avoid: [appearance as worth, comparing bodies or looks, brand or price status]}
      11: {depth: system, framing: "fashion as a chain of hands; who grows the cotton, who dyes it, who sews it, and choosing clothes made to last", vocabulary: [textile, dye, durable], avoid: [appearance as worth, comparing bodies or looks, brand or price status]}
      12: {depth: system, framing: "costume design tells a story before anyone speaks; how designers use color, shape, and wear-and-tear to say who a character is", vocabulary: [costume design, silhouette, character], avoid: [appearance as worth, comparing bodies or looks, brand or price status]}
    edges:
      adjacent: [knowledge_domain.dance_around_the_world, knowledge_domain.theater_and_pretending, knowledge_domain.drawing_and_animation]
      prerequisite: []
    crosswalk:
      ngss: []
      casel: []
    milestones:
      note: "Covers the fashion + makeup parent requests. Makeup is framed strictly as costume and transformation (stage makeup, face paint), never as appearance improvement."
      reviewed_by: null
    status: draft

