    label: musical_instruments
    display_name: "Musical Instruments"
    region: arts_and_music
    age_bands: ["5-6", "7-8", "9-10"]
    age_treatments:
      5: {depth: sensory, framing: "bang, pluck, and blow; the drum, the guitar, and the flute", vocabulary: [drum, flute, guitar]}
      6: {depth: sensory, framing: "loud and soft, high and low; trying out sounds from instruments around the world", vocabulary: [piano, violin, trumpet]}
      7: {depth: mechanism, framing: "how instruments make sound; strings that shake and air that buzzes", vocabulary: [vibration, string, reed]}
      8: {depth: mechanism, framing: "instrument families in an orchestra; strings, woodwinds, brass, and percussion", vocabulary: [orchestra, percussion, brass]}
      9: {depth: system, framing: "how a hundred players sound like one; the conductor, the sheet music, and tuning up together", vocabulary: [conductor, sheet music, harmony]}
