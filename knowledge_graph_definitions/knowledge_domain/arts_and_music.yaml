  - id: knowledge_domain.drawing_and_animation
    axis: knowledge_domain
    label: drawing_and_animation
    display_name: "Drawing and Animation"
    region: arts_and_music
    age_bands: ["7-8", "9-10", "11-12"]
    age_treatments:
      7: {depth: mechanism, framing: "making pictures move; flipbooks where your drawings come alive", vocabulary: [flipbook, sketch, frame]}
      8: {depth: mechanism, framing: "one second of cartoon takes a pile of drawings; frames, timing, and the trick of motion", vocabulary: [cartoon, animation, motion]}
      9: {depth: system, framing: "from first sketch to the screen; storyboards, character designs, and a studio full of jobs", vocabulary: [storyboard, animator, character design]}
      10: {depth: system, framing: "how computers joined the drawing table; digital animation, stop motion, and mixing the old with the new", vocabulary: [computer animation, stop motion, render]}
      11: {depth: system, framing: "an animation pipeline up close; keyframes and in-betweens, and why timing makes twelve drawings feel smoother than twenty-four", vocabulary: [keyframe, in-between, timing]}
      12: {depth: system, framing: "style as a set of choices; the line, color, and movement rules a whole team follows so one film feels drawn by a single hand", vocabulary: [style guide, palette, motion]}
