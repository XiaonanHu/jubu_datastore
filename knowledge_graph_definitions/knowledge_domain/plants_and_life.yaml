      5: {depth: sensory, framing: "flowers are invitations — bright colors, sweet smells, and bees stopping by for a sip", vocabulary: [petal, bee, smell]}
      6: {depth: sensory, framing: "the yellow dust on the bee's fuzzy legs — flowers giving out gifts to their visitors", vocabulary: [pollen, nectar, bud]}
      7: {depth: mechanism, framing: "the flower deal — nectar for the visitor, pollen delivery for the plant, seeds as the payoff", vocabulary: [pollination, pollinator, bloom]}
      8: {depth: mechanism, framing: "matchmaking by design — why some flowers pick bees, others pick hummingbirds or moths", vocabulary: [petal shape, hummingbird, fragrance]}
      9: {depth: system, framing: "no pollinators, no apples — how flowers and their visitors keep farms and meadows running", vocabulary: [crop pollination, wildflower meadow, hive]}
      10: {depth: system, framing: "flowers and pollinators shaped each other over millions of years — a partnership written in petal and wing", vocabulary: [co-evolution, orchid, pollinator decline], avoid: [hopeless doom framing about bee decline]}
