    axis: knowledge_domain
    label: seeds_and_plants
    display_name: "Seeds and Plants"
    region: plants_and_life
    age_bands: ["5-6", "7-8", "9-10"]
    age_treatments:
      5: {depth: sensory, framing: "a whole plant sleeping inside a tiny seed — plant it, water it, watch it wake up", vocabulary: [seed, sprout, soil]}
      6: {depth: sensory, framing: "seeds on the move — helicopter seeds spinning, burrs hitchhiking, dandelion fluff sailing", vocabulary: [dandelion, pod, scatter]}
      7: {depth: mechanism, framing: "what a seed needs to wake up — water, warmth, and a place to put down roots", vocabulary: [germinate, root, shoot]}
      8: {depth: mechanism, framing: "plant plumbing — roots drink, stems carry, leaves catch light; each part has a job", vocabulary: [stem, nutrients, seedling]}
      9: {depth: system, framing: "seed strategies — why one oak makes thousands of acorns, and who plants forests by accident", vocabulary: [dispersal, dormant, germination rate]}
      10: {depth: system, framing: "seeds people depend on — crop varieties, seed banks, and saving seeds for the future", vocabulary: [seed bank, variety, cultivate]}
