      7: {depth: mechanism, framing: "a game is a picture made of tiny squares plus a rulebook the computer follows, redrawn faster than your eye can blink", vocabulary: [pixel, sprite, rule], avoid: [violent game content, screen-time shaming or lecturing, calling games addictive]}
      9: {depth: system, framing: "why a good level feels like a good story; designers tuning challenge and surprise so players stay curious instead of stuck", vocabulary: [level design, challenge, playtest], avoid: [violent game content, screen-time shaming or lecturing, calling games addictive]}
      11: {depth: system, framing: "reading a game the way its makers do; spotting the tutorial hidden inside level one and the loops of goal, choice, and reward that keep play interesting", vocabulary: [mechanic, tutorial, reward loop], avoid: [violent game content, screen-time shaming or lecturing, calling games addictive]}
