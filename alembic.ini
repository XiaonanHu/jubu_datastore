# Alembic configuration for jubu_datastore.
#
# There is deliberately NO default sqlalchemy.url here: the URL must come from
# the DATABASE_URL environment variable or `-x db_url=...` (see alembic/env.py).
# This prevents `alembic upgrade` from silently migrating the dev kidschat.db.

[alembic]
script_location = %(here)s/alembic

# Template for new revision files; keep ids short and ordered.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
