name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[test,dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy .

      # Use the pytest entrypoint, not `python -m pytest`: the latter puts the
      # repo root (which contains the package's logging/ subpackage) on
      # sys.path[0], shadowing the stdlib logging module and crashing startup.
      # ENCRYPTION_KEY is generated by tests/conftest.py.
      - name: Run tests
        run: pytest tests/ -v

      - name: Verify Alembic migrations
        run: python scripts/verify_migrations.py
